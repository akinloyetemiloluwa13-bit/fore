<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A demo examination portal for student enrollment, exam scheduling, timed tests, and attendance."
    />
    <title>Fore | Biometric Examination Software</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" data-view="dashboard" aria-label="Fore dashboard">
          <span class="brand-copy">
            <strong id="strong">FORE</strong>
            <small>Examination portal</small>
          </span>
        </a>

        <p class="nav-caption">WORKSPACE</p>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-link is-active" type="button" data-view="dashboard">
            <span class="nav-icon" aria-hidden="true">⌂</span> Dashboard
          </button>
          <button class="nav-link" type="button" data-view="students">
            <span class="nav-icon" aria-hidden="true">♙</span> Students
          </button>
          <button class="nav-link" type="button" data-view="exams">
            <span class="nav-icon" aria-hidden="true">▤</span> Examinations
          </button>
          <button class="nav-link" type="button" data-view="take">
            <span class="nav-icon" aria-hidden="true">◷</span> Take exam
          </button>
          <button class="nav-link" type="button" data-view="desk">
            <span class="nav-icon" aria-hidden="true">✓</span> Exam check-in
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="privacy-note">
            <span class="privacy-icon" aria-hidden="true">◇</span>
            <strong>Privacy first</strong>
            <p>This demo stores student records, exam papers, and attempts in this browser only.</p>
          </div>
          <button class="nav-link" type="button" data-view="security">
            <span class="nav-icon" aria-hidden="true">⚙</span> Integration &amp; security
          </button>
          <div class="user-chip">
            <span class="avatar" aria-hidden="true">A</span>
            <span><strong>Administrator</strong><small>Local demo account</small></span>
          </div>
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span aria-hidden="true">/</span><strong id="page-name">Overview</strong></div>
          <div class="topbar-status"><span class="status-dot"></span> Demo mode</div>
        </header>
        <main id="app" class="content" tabindex="-1"></main>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="model.js" defer></script>
    <script src="view.js" defer></script>
    <script src="controller.js" defer></script>
  </body>
</html>
